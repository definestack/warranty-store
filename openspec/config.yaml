# Brownfield architecture baseline.
# Verified against commit f3ad279 (2026-08-25). Facts only — every statement below was
# read from the codebase, not inferred. Update when the code changes.
context: |
  # Warranty Store — architecture baseline

  Offline-first Android app (Expo managed workflow) for tracking product warranty expiry
  and invoice images. No backend, no network calls. SQLite is the source of truth.
  Android package: in.definestack.warrantystore. App name: "Warranty Store".

  ## Stack
  Expo SDK ~54, React Native 0.81.5, React 19.1.0, TypeScript ~5.9.
  State: zustand 5. DB: expo-sqlite ~16 (`warranty-store.db`). Settings: AsyncStorage.
  UI: react-native-paper 5.15 (Material 3) plus custom components. Nav: React Navigation 7
  (native-stack + bottom-tabs). i18n: i18n-js. Archives: jszip.
  Expo modules in use: notifications, image-picker, image-manipulator, file-system (legacy
  API surface), document-picker, sharing, localization, crypto (randomUUID), font,
  status-bar, linear-gradient. app.json plugins: expo-sqlite, datetimepicker,
  expo-image-picker (with photo/camera permission strings), expo-font, expo-localization,
  expo-notifications.

  ## Layout and responsibilities
  src/db/          schema.ts (DDL constants), migrations.ts, database.ts (singleton),
                   3 repositories: warranty, invoiceImages, notificationSchedules
  src/services/    notification, file, image, backup, restore, notificationPreference,
                   backupPreference
  src/store/       zustand: itemsStore, notificationsStore, toastStore
  src/screens/     Home, ItemDetail, AddEditItem, Settings (4 total)
  src/components/  13 presentational components (Card, ScreenHeader, StatusBadge,
                   SelectModal, InvoiceImageViewer, Toast, AppTabBar, ...)
  src/navigation/  RootNavigator, MainTabNavigator, navigationRef
  src/types/       warranty.ts, notification.ts, navigation.ts
  src/utils/       date, validation, itemFilters, categories
  src/i18n/        i18n.ts, LocaleContext.tsx, locales/{en,es,fr,de}.ts
  src/theme/       palette.ts (AppTheme derived from MD3 themes), ThemeContext.tsx
  Entry: src/index.ts -> src/App.tsx (package.json "main" is src/index.ts).

  App.tsx provider order: GestureHandlerRootView > LocaleProvider > ThemeProvider >
  SafeAreaProvider > PaperProvider > NavigationContainer. Render is gated on
  initDatabase(); failure renders an error screen. A notification-response listener routes
  taps to ItemDetail via navigationRef.

  ## Navigation
  RootStack (headerShown: false): MainTabs -> BottomTabs, ItemDetail { itemId },
  AddEditItem { itemId? } — itemId absent means create. Tabs: Home, Categories, Reminders,
  Settings. Categories and Reminders render an empty View and intercept tabPress to show a
  toast; they have no screens.

  ## Persistence — SQLite
  schema_migrations(version PK, applied_at). runMigrations reads MAX(version) and applies
  each pending migration inside its own transaction. Migrations are additive only:
    1 create warranty_items
    2 add brand TEXT, price REAL
    3 add store TEXT
    4 create invoice_images + backfill one row per non-null warranty_items.invoice_uri
    5 create notification_schedules
    6 add photo_uri TEXT to warranty_items
  warranty_items(id PK TEXT/uuid, name, purchase_date, warranty_months, expiry_date,
    category, notes, invoice_uri, created_at, updated_at, brand, price, store, photo_uri).
    invoice_uri is a retained legacy column, superseded by invoice_images and no longer
    read by the repository mapper. photo_uri is nullable and holds the app-private URI of
    the item's single optional photo; updateItem with photoUri: undefined clears it, while
    omitting the key preserves it.
  invoice_images(id PK, item_id, uri, sort_order DEFAULT 0, created_at).
  notification_schedules(id PK, item_id, reminder_kind, notification_id, trigger_at,
    created_at). reminder_kind is 'thirtyDay' | 'sevenDay' | 'onExpiry'.
  No foreign keys and no indexes on item_id; child rows are deleted explicitly inside
  transactions (deleteItem removes invoice_images then warranty_items).
  Dates are stored as strings: YYYY-MM-DD for dates, full ISO-8601 for timestamps.
  Ids are Crypto.randomUUID().

  ## Persistence — AsyncStorage (settings only, exactly four keys)
  settings.notificationsEnabled (absent or != 'false' means enabled)
  settings.lastBackupTime, settings.themePreference, settings.languagePreference
  ('system' or a locale). No warranty data is stored in AsyncStorage.

  ## Domain rules (all unit-tested)
  expiry_date is derived at write time by addMonths(purchase_date, warranty_months) in
  createItem and updateItem — never supplied by callers, recomputed on every update.
  addMonths parses UTC and inherits JS Date month overflow (2026-01-31 + 1 month becomes
  2026-03-03); this is pinned by test as intended behaviour. toIsoDate/fromIsoDate
  deliberately use local time to avoid day-shift.
  getWarrantyStatus: days remaining < 0 is 'expired', <= 30 is 'expiring', else 'active'.
  Reminders: 30 days before, 7 days before, and on expiry, each at 09:00 local, filtered to
  future triggers only. Notification content is translated at schedule time. Each scheduled
  notification's OS id is persisted in notification_schedules, which is the only handle for
  later cancellation. Expired items are skipped when (re)scheduling in bulk.
  Categories are a hardcoded stable list persisted verbatim (Electronics, Appliances,
  Furniture, Vehicles, Other) with DEFAULT_CATEGORY 'Uncategorized'; only display labels
  are localized.
  Validation: warranty months must be a positive integer; price is optional and must be
  >= 0; notes max 500 chars.
  Images: picker quality 0.7; files copied into documentDirectory/invoices/ as
  invoice-<uuid>.jpg; resized to max dimension 1600 at compress 0.8 only when larger;
  compression failure falls back to saving the original. MAX_INVOICE_PAGES is 10. Original
  gallery URIs are never retained. Item photos reuse the same save pipeline in their own
  directory: at most one per item, copied into documentDirectory/photos/ as
  photo-<uuid>.jpg, picked from camera or gallery. A photo file that is replaced, removed,
  or attached and then abandoned by leaving the screen without saving is deleted;
  itemsStore.deleteItem deletes the item's photo file alongside its invoice files. A photo
  that cannot be displayed falls back to the category icon.
  Error policy: per-item, per-notification and per-image failures are logged and skipped so
  one failure cannot undo an otherwise successful save, restore or cancel.

  ## Backup format (version 1)
  Export: zip containing data.json { formatVersion, exportedAt, items[] } plus
  invoices/<imageId><ext> and photos/photo-<itemId><ext>; each item's invoiceImages[].uri
  and photoUri are rewritten to those relative paths. Written to cacheDirectory/backups/,
  then offered through the OS share sheet. An unreadable invoice or photo file is detected
  before anything is written and reported as BackupMissingFilesError; re-running with
  { skipMissingFiles: true } exports without those files and reports skippedFileCount.
  Success is deliberately NOT gated on the share sheet outcome (Android resolves
  identically whether the user saves or dismisses).
  Import: picked with type '*/*' (Android MIME types for zip are unreliable), fully parsed
  and validated in memory before any write — BackupValidationError('invalid' or
  'unsupportedVersion') is thrown first. Merge is strictly additive: items whose id already
  exists are skipped, never overwritten; ids, expiry dates and timestamps are preserved as
  exported. photoUri is validated as an optional string and unpacked back into
  app-private storage; a photo missing from the archive or one whose write fails imports
  the item without a photo, and a backup taken before item photos existed imports cleanly.
  Unreadable images are dropped rather than failing the item. Returns
  { imported, skipped }. Reminders are scheduled for imported non-expired items when
  notifications are enabled.

  ## Known structural facts (accepted at this baseline, not yet addressed)
  - Item create/update orchestration lives in AddEditItemScreen (936 lines): repository
    write, invoice-file reconciliation, reminder rescheduling and the permission prompt all
    sit in handleSave, calling repositories and services directly rather than via a store.
    Delete is the opposite — fully owned by itemsStore and covered by tests.
  - No screen or component tests exist; screens are the only untested logic.
  - src/utils/mockData.ts is unreferenced.
  - File access uses the expo-file-system/legacy API surface throughout, consistently,
    including in the test mock.
  - Nothing reconciles notification_schedules against actual OS-scheduled notifications;
    the table is trusted as truth. No setNotificationHandler and no Android notification
    channel are configured.
  - Category filtering logic exists (filterItems) with no Categories screen to drive it.

  ## Testing
  Jest with the jest-expo preset; 18 suites / 265 tests passing at this baseline, covering
  db/, services/, store/, utils/ and i18n/ only. Run with `npm test`.
  __mocks__/expo-sqlite.ts backs the async expo-sqlite API with a real in-memory
  better-sqlite3 engine, so migration and repository tests execute real SQL. Other native
  modules have hand-written stateful mocks with __set*/__reset* test hooks:
  expo-file-system/legacy, expo-sharing, expo-document-picker, expo-image-manipulator,
  expo-image-picker, expo-notifications, expo-crypto.
  TDD is the stated requirement for db/, services/, utils/ and store logic.

  ## Process conventions enforced by this repo
  CI on PRs to main: npm run typecheck, npm run lint, npx expo-doctor,
  npx expo export --platform android, npm test.
  A PreToolUse hook denies every Edit/Write until the impact-analysis skill has run for the
  task and its marker is created via Bash; a UserPromptSubmit hook clears that marker each
  turn. Rules in .claude/rules/ additionally require: docs/design/ is the single source of
  truth for UI work and mockups are reproduced rather than reinterpreted; conventional
  commits; never commit on main; ask before committing.
  Do not add dependencies or scaffold planned Phase 2 features (Google Drive backup, sync,
  OCR, barcode scanning, PDF export, widgets) unless explicitly requested.

